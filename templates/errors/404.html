{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-lg-6">
            <div class="glass-card p-5">
                <h1 style="font-size: 8rem; font-weight: 800; color: var(--bms-primary); line-height: 1;">404</h1>
                <h2 class="text-white mb-3" style="font-weight: 700;">Page Not Found</h2>
                <p class="text-secondary mb-4">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
                <a href="{{ url_for('main.index') }}" class="btn btn-bms btn-lg">
                    <i class="bi bi-house-door me-2"></i>Go Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
