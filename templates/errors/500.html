{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-lg-6">
            <div class="glass-card p-5">
                <h1 style="font-size: 8rem; font-weight: 800; color: var(--bms-red); line-height: 1;">500</h1>
                <h2 class="text-white mb-3" style="font-weight: 700;">Server Error</h2>
                <p class="text-secondary mb-4">Something went wrong on our end. Please try again later or contact support if the problem persists.</p>
                <a href="{{ url_for('main.index') }}" class="btn btn-bms btn-lg">
                    <i class="bi bi-house-door me-2"></i>Go Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
